<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09131a"><title>Poker Privado • Texas Hold'em</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f0f5f4;background:#09131a}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;color:white;background:#243743}button:hover{filter:brightness(1.16)}button:disabled{opacity:.35;cursor:not-allowed}.gold{background:#b28a43;color:#101719}.green{background:#087d5b}.red{background:#9e3445}.blue{background:#225eae}.shell{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid #2b3a41;gap:10px}.brand{font-weight:850;color:#f1d494;font-size:20px}.muted{color:#a2b4ba;font-size:12px}.layout{display:flex;flex:1;min-height:0}.game{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px}.tableWrap{flex:1;min-height:380px;display:grid;place-items:center}.table{width:min(95%,980px);height: min(58vw,500px);min-height:310px;position:relative;border:15px solid #4c3324;box-shadow:0 0 0 5px #c6a25d,0 20px 60px #000a,inset 0 0 75px #001d13;border-radius:50%;background:radial-gradient(ellipse,#126346,#06402e 75%,#02261b)}.center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;width:75%}.pot{display:inline-block;background:#092d23;padding:7px 20px;border-radius:30px;color:#e9d295;font-weight:700;margin-bottom:12px}.board{display:flex;justify-content:center;gap:5px}.card{width:clamp(31px,5.3vw,65px);height:clamp(45px,7.4vw,90px);border-radius:6px;background:#f9f9f5;color:#161e21;display:grid;place-items:center;font-size:clamp(17px,3vw,31px);font-weight:850;box-shadow:0 3px 6px #0007}.card.redSuit{color:#c52e42}.card.back{background:repeating-linear-gradient(45deg,#b22c42,#b22c42 4px,#ecb3ba 5px,#6d1e30 7px);border:3px solid white}.seat{position:absolute;transform:translate(-50%,-50%);min-width:100px;max-width:140px;background:#111e28;border:2px solid #60727a;border-radius:15px;padding:6px 9px;text-align:center;font-size:12px;box-shadow:0 5px 12px #0009}.seat.turn{border-color:#5cf2a6;box-shadow:0 0 14px #3dfcae}.seat.me{border-color:#dfb55f}.seat .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat .chips{color:#f5d793}.seat .mini{display:flex;justify-content:center;gap:2px}.seat .mini .card{width:23px;height:32px;font-size:14px}.seat.off{opacity:.5}.actions{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.actions input{width:95px;background:#172b35;color:white;border:1px solid #54646c;border-radius:8px;padding:10px}.sidebar{width:310px;max-width:40vw;background:#0e1b25;border-left:1px solid #2b3a41;display:flex;flex-direction:column;padding:15px;gap:12px}.chat{flex:1;min-height:140px;max-height:50vh;overflow:auto;background:#0a151d;border-radius:12px;padding:12px;font-size:13px}.msg{margin-bottom:10px}.msg b{color:#e5c17a}.send{display:flex;gap:5px}.send input,.entry input{background:#192b36;border:1px solid #45606a;border-radius:9px;padding:12px;color:white;min-width:0;width:100%}.info{background:#152630;padding:12px;border-radius:10px;font-size:13px}.entry{margin:auto;width:min(440px,92vw);background:#12232d;border:1px solid #43515b;border-radius:22px;padding:26px;display:grid;gap:13px;box-shadow:0 20px 70px #0007}.entry h1{margin:0;color:#e5c17a}.entry label{font-size:13px;color:#bdd0d2}.hide{display:none!important}.notice{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#9d3745;padding:12px 20px;border-radius:10px;z-index:20}.winner{color:#ffe39d;text-align:center;font-weight:800}.mobileChat{display:none}@media(max-width:800px){.sidebar{width:240px}.game{padding:8px}.top{padding:6px 10px}.brand{font-size:15px}.tableWrap{min-height:260px}.table{min-height:230px;border-width:9px}.seat{min-width:72px;font-size:10px;padding:3px 5px}.seat .mini .card{width:17px;height:24px;font-size:11px}.actions button{padding:7px 9px;font-size:12px}.actions input{padding:7px;width:70px}.card{width:32px;height:46px;font-size:17px}.center{top:48%}}@media(max-width:700px) and (orientation:portrait){.layout{flex-direction:column}.sidebar{max-width:none;width:100%;border-left:0}.tableWrap{min-height:320px}.table{height:300px}.mobileChat{display:inline-block}}@media(max-height:480px) and (orientation:landscape){.top{padding:3px 10px}.game{padding:4px}.tableWrap{min-height:180px}.table{height:65vh;min-height:170px;width:min(90%,750px)}.sidebar{padding:7px;width:225px}.chat{min-height:60px}.seat{min-width:70px}.actions button{padding:5px 9px}.card{width:27px;height:38px;font-size:16px}.pot{padding:3px 9px;margin-bottom:4px}.board{gap:3px}}
</style></head><body><div id="entry" class="entry"><h1>♠ Poker Privado</h1><div class="muted">Texas Hold'em • até 8 amigos • fichas virtuais</div><label>Seu nome</label><input id="name" maxlength="22" placeholder="Ex.: Caio"><button class="gold" onclick="create()">Criar mesa como administrador</button><div style="text-align:center;color:#aab">ou entre em uma sala</div><input id="room" maxlength="6" placeholder="Código da sala"><button onclick="join()">Entrar na mesa</button><div class="muted">No celular, gire a tela para a horizontal.</div></div><div id="app" class="shell hide"><header class="top"><div><span class="brand">♠ POKER PRIVADO</span><span class="muted"> • Texas Hold'em</span></div><div><b id="roomLabel"></b> <button onclick="copyLink()">Copiar convite</button></div><div class="muted" id="summary"></div><button class="mobileChat" onclick="toggleChat()">Chat</button></header><div class="layout"><main class="game"><div class="tableWrap"><div class="table" id="table"><div class="center"><div class="pot" id="pot">Pote: 0</div><div class="board" id="board"></div><div class="winner" id="winner"></div></div></div></div><div class="actions" id="actions"></div><div class="muted" id="status" style="text-align:center"></div></main><aside class="sidebar" id="sidebar"><b>💬 Chat da mesa</b><div class="chat" id="chat"></div><form class="send" onsubmit="send(event)"><input id="message" maxlength="240" placeholder="Mensagem..."><button class="blue">➤</button></form><div class="info" id="details"></div><div class="info" id="admin"></div><div class="info"><b>Últimas ações</b><div id="history"></div></div></aside></div></div><div id="notice" class="notice hide"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let state=null,secret=null;const positions=[[50,96],[22,83],[7,52],[21,17],[49,3],[78,17],[93,52],[78,83]];const suits={s:'♠',h:'♥',d:'♦',c:'♣'};function card(c){if(!c)return '<div class="card back"></div>';return `<div class="card ${'hd'.includes(c[1])?'redSuit':''}">${c[0]==='T'?'10':c[0]}${suits[c[1]]}</div>`}function notify(msg){$('notice').textContent=msg;$('notice').classList.remove('hide');setTimeout(()=>$('notice').classList.add('hide'),3500)}function ask(event,data={}){return new Promise(resolve=>socket.emit(event,data,r=>{if(!r.ok)notify(r.error);resolve(r)}))}function getName(){const n=$('name').value.trim();if(!n)notify('Digite seu nome');return n}async function create(){const name=getName();if(!name)return;const r=await ask('create',{name});if(r.ok)save(r)}async function join(){const name=getName(),code=$('room').value.trim().toUpperCase();if(!name||!code)return;const r=await ask('join',{name,code});if(r.ok)save(r)}function save(r){secret=r.token;localStorage.setItem('poker-session',JSON.stringify({code:r.code,token:r.token,name:$('name').value}));history.replaceState({},'',location.pathname+'?sala='+r.code)}function copyLink(){const url=location.origin+'/?sala='+state.code;navigator.clipboard?.writeText(url).then(()=>notify('Link copiado!')).catch(()=>prompt('Copie o link:',url))}function toggleChat(){$('sidebar').classList.toggle('hide')}function send(e){e.preventDefault();const input=$('message');if(input.value.trim())ask('chat',{message:input.value}).then(r=>{if(r.ok)input.value=''})}function move(type){const amount=Number($('raiseAmount')?.value);ask('move',{type,amount})}function seatHTML(p,i){const pos=positions[i];return `<div class="seat ${p.id===state.turn?'turn':''} ${p.id===state.me?'me':''} ${!p.connected?'off':''}" style="left:${pos[0]}%;top:${pos[1]}%"><div class="name">${escapeHtml(p.name)} ${p.id===state.button?'Ⓓ':''}</div><div class="chips">🪙 ${p.chips.toLocaleString('pt-BR')}</div><div class="mini">${p.cards.length?p.cards.map(card).join(''):p.cardBacks?card()+card():''}</div><div>${p.folded?'Desistiu':p.allIn?'ALL-IN':p.bet?'Aposta '+p.bet:''}</div></div>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(s){state=s;$('entry').classList.add('hide');$('app').classList.remove('hide');$('roomLabel').textContent='Sala '+s.code;$('summary').textContent=`${s.players.length}/8 • Blinds ${s.smallBlind}/${s.blind} • Nível ${s.blindLevel}`;$('pot').textContent='🪙 Pote: '+s.pot.toLocaleString('pt-BR');$('board').innerHTML=s.board.map(card).join('');$('winner').textContent=s.winner||'';document.querySelectorAll('.seat').forEach(e=>e.remove());const meIdx=s.players.findIndex(p=>p.id===s.me);s.players.forEach((p,i)=>{$('table').insertAdjacentHTML('beforeend',seatHTML(p,(i-meIdx+8)%8))});const me=s.players[meIdx],myTurn=s.turn===s.me,owed=Math.max(0,s.bet-(me?.bet||0));let buttons='';if(myTurn){buttons=`<button class="red" onclick="move('fold')">Desistir</button>${owed?`<button class="blue" onclick="move('call')">Pagar ${owed}</button>`:`<button class="blue" onclick="move('check')">Passar</button>`}<input id="raiseAmount" type="number" min="${s.bet+s.blind}" max="${me.chips+me.bet}" value="${Math.min(me.chips+me.bet,s.bet+s.blind)}"><button class="green" onclick="move('raise')">Aumentar</button><button class="gold" onclick="move('allin')">All-in</button>`}if(s.admin&&['waiting','showdown'].includes(s.phase))buttons+=`<button class="gold" onclick="ask('start')">▶ ${s.phase==='waiting'?'Iniciar':'Próxima mão'}</button>`;$('actions').innerHTML=buttons;$('status').textContent=myTurn?'🟢 Sua vez!':s.phase==='waiting'?'Aguardando o administrador iniciar':s.phase==='showdown'?'Mão encerrada':`Etapa: ${s.phase} • Vez de ${s.players.find(p=>p.id===s.turn)?.name||'aguardando'}`;$('chat').innerHTML=s.chat.map(m=>`<div class="msg"><b>${escapeHtml(m.name)}</b> <span class="muted">${new Date(m.time).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><div>${escapeHtml(m.message)}</div></div>`).join('');$('chat').scrollTop=$('chat').scrollHeight;$('details').innerHTML=`<b>Partida</b><p>Jogadores: ${s.players.length}/8<br>Fichas iniciais: 10.000<br>Blinds: ${s.smallBlind}/${s.blind}<br>Próximo aumento: ${Math.floor((s.seconds||0)/60)}:${String((s.seconds||0)%60).padStart(2,'0')}</p>`;$('history').innerHTML=s.log.slice(-5).reverse().map(x=>`<p class="muted">${escapeHtml(x)}</p>`).join('');$('admin').innerHTML=s.admin?`<b>👑 Administração</b><p><button class="red" onclick="if(confirm('Reiniciar o torneio e zerar todas as fichas?'))ask('reset')">Reiniciar torneio</button></p>${s.players.filter(p=>p.id!==s.me).map(p=>`<div>${escapeHtml(p.name)} <button onclick="if(confirm('Remover jogador?'))ask('kick',{id:'${p.id}'})">Remover</button></div>`).join('')}`:'Mesa privada • acesso por convite'}socket.on('state',render);socket.on('kicked',()=>{localStorage.removeItem('poker-session');location.href='/'});socket.on('notice',notify);const params=new URLSearchParams(location.search);$('room').value=params.get('sala')||'';try{const old=JSON.parse(localStorage.getItem('poker-session'));if(old){$('name').value=old.name||'';ask('join',old).then(r=>{if(!r.ok)localStorage.removeItem('poker-session')})}}catch{}
</script></body></html>
